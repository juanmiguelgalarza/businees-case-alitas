<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Business Case — WingStop</title>
<style>
  html,body{margin:0;padding:0;background:#f8f9fa;}
  body{font-family:'Segoe UI',Arial,sans-serif;}
  input[type=number]{font-family:inherit;}
  /* hide spin buttons for cleaner look */
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  input[type=number]{-moz-appearance:textfield;}
</style>

<!-- React + Babel via CDN. No build step required. -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root">Cargando…</div>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useCallback } = React;

const MO_PCT = [0.05,0.05,0.05,0.05,0.05,0.05,0.10,0.10,0.10,0.10,0.15,0.15];
const MO_LBL = ["MES 1","MES 2","MES 3","MES 4","MES 5","MES 6","MES 7","MES 8","MES 9","MES 10","MES 11","MES 12"];

const fmt = (v,d=0) => {
  if(v===null||v===undefined||isNaN(v)) return "-";
  let n = Number(v).toFixed(d);
  let [int,dec] = n.split(".");
  int = int.replace(/\B(?=(\d{3})+(?!\d))/g,".");
  return dec ? `${int},${dec}` : int;
};
const fmtU = v => fmt(v,0);
const fmtM = v => fmt(v,2);
const fmtP = v => `${fmt(v,1)}%`;

const initIngredients = () => ({
  boneless: [
    {name:"Boneless",qty:8,uom:"uni",w:8,cu:0.1919},
    {name:"Sauce of choice (1 oz)",qty:1,uom:"oz",w:2,cu:0.15},
    {name:"Sauce to dip (3.2 oz) Ranch",qty:1,uom:"oz",w:3.2,cu:0.0178},
    {name:"Fries 9 OZ",qty:1,uom:"gr",w:130,cu:0.0022069},
    {name:"Soda 16 oz",qty:1,uom:"oz",w:12,cu:0.0225},
    {name:"Aceite",qty:1,uom:"litre",w:0.015,cu:1.6162},
    {name:"Wingstop paper tray #L",qty:1,uom:"uni",w:1,cu:0.0459},
    {name:"Wingstop wrap paper #L",qty:1,uom:"uni",w:1,cu:0.0107},
    {name:"CUP PORTN PLAS 3.25 OZ CLR PP",qty:1,uom:"uni",w:1,cu:0.0224},
  ],
  wings: [
    {name:"Wings",qty:8,uom:"uni",w:8,cu:0.1964},
    {name:"Sauce of choice (1 oz)",qty:1,uom:"oz",w:2,cu:0.15},
    {name:"Sauce to dip (3.2 oz)",qty:1,uom:"oz",w:3.2,cu:0.0178},
    {name:"Fries 9 OZ",qty:1,uom:"gr",w:130,cu:0.0022069},
    {name:"Soda 16 oz",qty:1,uom:"oz",w:12,cu:0.0225},
    {name:"Aceite",qty:1,uom:"litre",w:0.015,cu:1.6162},
    {name:"Wingstop paper tray #L",qty:1,uom:"uni",w:1,cu:0.0459},
    {name:"Wingstop wrap paper #L",qty:1,uom:"uni",w:1,cu:0.0107},
    {name:"CUP PORTN PLAS 3.25 OZ CLR PP",qty:1,uom:"uni",w:1,cu:0.0224},
  ],
  tender: [
    {name:"Tenders x 3 (40 gr c/u)",qty:3,uom:"uni",w:3,cu:0.4087},
    {name:"Sauce of choice (1 oz)",qty:1,uom:"oz",w:2,cu:0.15},
    {name:"Sauce to dip (3.2 oz)",qty:1,uom:"oz",w:3.2,cu:0.0178},
    {name:"Fries 9 OZ",qty:1,uom:"gr",w:130,cu:0.0022069},
    {name:"Soda 16 oz",qty:1,uom:"oz",w:12,cu:0.0225},
    {name:"Aceite",qty:1,uom:"litre",w:0.015,cu:1.6162},
    {name:"Wingstop paper tray #L",qty:1,uom:"uni",w:1,cu:0.0459},
    {name:"Wingstop wrap paper #L",qty:1,uom:"uni",w:1,cu:0.0107},
    {name:"CUP PORTN PLAS 3.25 OZ CLR PP",qty:1,uom:"uni",w:1,cu:0.0224},
  ]
});

const OCell = ({value, onChange, type="number", step, style={}}) => (
  <input type={type} value={value} onChange={e=>onChange(type==="number"?parseFloat(e.target.value)||0:e.target.value)}
    step={step} style={{background:"#FFD966",border:"1px solid #cca300",padding:"2px 4px",width:"100%",textAlign:"right",
    fontWeight:"bold",fontSize:"11px",boxSizing:"border-box",...style}}/>
);

function BusinessCase() {
  const [tab, setTab] = useState(0);
  const [fs, setFs] = useState(900000);
  const [co, setCo] = useState(450000);
  const [fd, setFd] = useState(300000);
  const [costPct, setCostPct] = useState(32);
  const [pvp, setPvp] = useState({b:9.99,w:10.99,t:8.99});
  const [mix, setMix] = useState({b:33,w:34,t:33});
  const [ing, setIng] = useState(initIngredients);
  const [launchCore, setLaunchCore] = useState(5);
  const [launchFD, setLaunchFD] = useState(5);

  const total = fs+co+fd;

  const lineRev = useMemo(()=>{
    const calc = (annual,startM)=> MO_PCT.map((p,i)=> i>=(startM-1)?annual*p:0);
    return {fs:calc(fs,1), co:calc(co,launchCore), fd:calc(fd,launchFD)};
  },[fs,co,fd,launchCore,launchFD]);

  const comboRevSplit = useMemo(()=>{
    const s = mix.b+mix.w+mix.t;
    return {b:mix.b/s, w:mix.w/s, t:mix.t/s};
  },[mix]);

  const comboCost = useMemo(()=>{
    const calc = items => {
      const raw = items.reduce((s,it)=>s+it.w*it.cu,0);
      return {raw, buffered: raw*1.05};
    };
    return {b:calc(ing.boneless), w:calc(ing.wings), t:calc(ing.tender)};
  },[ing]);

  const y1Rev = useMemo(()=>({
    fs: lineRev.fs.reduce((a,b)=>a+b,0),
    co: lineRev.co.reduce((a,b)=>a+b,0),
    fd: lineRev.fd.reduce((a,b)=>a+b,0),
  }),[lineRev]);

  const y1Total = y1Rev.fs+y1Rev.co+y1Rev.fd;

  const updateIng = useCallback((combo,idx,field,val)=>{
    setIng(prev=>{
      const n={...prev};
      n[combo]=[...n[combo]];
      n[combo][idx]={...n[combo][idx],[field]:parseFloat(val)||0};
      return n;
    });
  },[]);

  const tabStyle = (i) => ({
    padding:"8px 16px",cursor:"pointer",fontWeight:tab===i?"bold":"normal",
    background:tab===i?"#1a5276":"#2c3e50",color:"#fff",border:"none",
    borderRadius:"6px 6px 0 0",fontSize:"12px",marginRight:"2px"
  });

  const thS = {background:"#1a5276",color:"#fff",padding:"4px 6px",fontSize:"10px",textAlign:"right",position:"sticky",top:0,whiteSpace:"nowrap",border:"1px solid #154360"};
  const tdS = {padding:"3px 6px",fontSize:"11px",textAlign:"right",border:"1px solid #d5d8dc",whiteSpace:"nowrap"};
  const tdL = {...tdS,textAlign:"left",fontWeight:"500"};
  const tdB = {...tdS,fontWeight:"bold",background:"#eaf2f8"};
  const tdBL = {...tdL,fontWeight:"bold",background:"#eaf2f8"};
  const tdCel = {...tdS,background:"#d4effc"};

  const PLTab = () => {
    const costoRow = MO_PCT.map((_,i)=>{
      const rev = lineRev.fs[i]+lineRev.co[i]+lineRev.fd[i];
      return rev*(costPct/100);
    });
    const margenRow = MO_PCT.map((_,i)=>{
      const rev = lineRev.fs[i]+lineRev.co[i]+lineRev.fd[i];
      return rev - costoRow[i];
    });
    const costoTotal = costoRow.reduce((a,b)=>a+b,0);
    const margenTotal = y1Total - costoTotal;
    const annualCosto = total*(costPct/100);

    const Row = ({label,vals,y1,annual,bold,indent,isCel})=>{
      const s = bold?tdB:isCel?tdCel:tdS;
      const sL = bold?tdBL:{...tdL,paddingLeft:indent?`${indent*16}px`:"6px"};
      return(
        <tr>
          <td style={sL}>{label}</td>
          <td style={{...s,background:bold?"#eaf2f8":"#fff"}}>{annual!=null?fmtM(annual):""}</td>
          {vals.map((v,i)=><td key={i} style={s}>{v===0?"-":fmtM(v)}</td>)}
          <td style={{...s,background:"#d5f5e3"}}>{fmtM(y1)}</td>
        </tr>
      );
    };

    const ComboRows = ({lineVals,lineY1,label,annual})=>{
      const bV=lineVals.map(v=>v*comboRevSplit.b);
      const wV=lineVals.map(v=>v*comboRevSplit.w);
      const tV=lineVals.map(v=>v*comboRevSplit.t);
      return(<>
        <Row label={label} vals={lineVals} y1={lineY1} annual={annual} bold/>
        <Row label="BONELESS (SODA & FRIES)" vals={bV} y1={lineY1*comboRevSplit.b} indent={2}/>
        <Row label="WINGS (SODA & FRIES)" vals={wV} y1={lineY1*comboRevSplit.w} indent={2}/>
        <Row label="3 PIECES TENDER (SODA & FRIES)" vals={tV} y1={lineY1*comboRevSplit.t} indent={2}/>
      </>);
    };

    return (
      <div style={{overflowX:"auto"}}>
        <table style={{borderCollapse:"collapse",width:"100%",minWidth:"1200px"}}>
          <thead>
            <tr>
              <th style={{...thS,textAlign:"left",minWidth:"220px"}}></th>
              <th style={{...thS,minWidth:"90px"}}>Meta Anual</th>
              {MO_LBL.map((m,i)=><th key={i} style={thS}>{m}<br/><span style={{color:"#aed6f1"}}>{(MO_PCT[i]*100)}%</span></th>)}
              <th style={{...thS,background:"#196f3d",minWidth:"90px"}}>TOTAL Y1</th>
            </tr>
          </thead>
          <tbody>
            <tr style={{background:"#eaf2f8"}}>
              <td style={tdBL}>2. INGRESOS</td>
              <td style={tdB}>{fmtM(total)}</td>
              {MO_PCT.map((_,i)=><td key={i} style={tdB}>{fmtM(lineRev.fs[i]+lineRev.co[i]+lineRev.fd[i])}</td>)}
              <td style={{...tdB,background:"#d5f5e3"}}>{fmtM(y1Total)}</td>
            </tr>
            <ComboRows lineVals={lineRev.fs} lineY1={y1Rev.fs} label="Ventas FlagShip" annual={fs}/>
            <tr><td style={tdL} colSpan={2}>
              <div style={{display:"flex",alignItems:"center",gap:4}}>
                <span style={{fontSize:"10px",color:"#777"}}>Meta FlagShip:</span>
                <OCell value={fs} onChange={setFs} style={{width:100}}/>
              </div>
            </td><td colSpan={13}></td></tr>
            <ComboRows lineVals={lineRev.co} lineY1={y1Rev.co} label="Ventas Core" annual={co}/>
            <tr><td style={tdL} colSpan={2}>
              <div style={{display:"flex",alignItems:"center",gap:4,flexWrap:"wrap"}}>
                <span style={{fontSize:"10px",color:"#777"}}>Meta Core:</span>
                <OCell value={co} onChange={setCo} style={{width:100}}/>
                <span style={{fontSize:"10px",color:"#777",marginLeft:8}}>Lanzamiento mes:</span>
                <OCell value={launchCore} onChange={v=>setLaunchCore(Math.max(1,Math.min(12,v)))} style={{width:40}}/>
              </div>
            </td><td colSpan={13}></td></tr>
            <ComboRows lineVals={lineRev.fd} lineY1={y1Rev.fd} label="Ventas FrontDesk" annual={fd}/>
            <tr><td style={tdL} colSpan={2}>
              <div style={{display:"flex",alignItems:"center",gap:4,flexWrap:"wrap"}}>
                <span style={{fontSize:"10px",color:"#777"}}>Meta FrontDesk:</span>
                <OCell value={fd} onChange={setFd} style={{width:100}}/>
                <span style={{fontSize:"10px",color:"#777",marginLeft:8}}>Lanzamiento mes:</span>
                <OCell value={launchFD} onChange={v=>setLaunchFD(Math.max(1,Math.min(12,v)))} style={{width:40}}/>
              </div>
            </td><td colSpan={13}></td></tr>
            <tr><td colSpan={15} style={{height:8,background:"#f8f9fa"}}></td></tr>
            <tr style={{background:"#fdf2e9"}}>
              <td style={tdBL}>3. COSTOS</td>
              <td style={tdB}></td>
              {costoRow.map((v,i)=><td key={i} style={tdB}>{fmtM(v)}</td>)}
              <td style={{...tdB,background:"#d5f5e3"}}>{fmtM(costoTotal)}</td>
            </tr>
            <tr>
              <td style={tdL}>
                <div style={{display:"flex",alignItems:"center",gap:4}}>
                  Costo de ventas
                  <OCell value={costPct} onChange={setCostPct} step={1} style={{width:50}}/>
                  <span style={{fontSize:"10px"}}>%</span>
                </div>
              </td>
              <td style={tdS}>{fmtM(annualCosto)}</td>
              {costoRow.map((v,i)=><td key={i} style={tdS}>{fmtM(v)}</td>)}
              <td style={{...tdS,background:"#d5f5e3"}}>{fmtM(costoTotal)}</td>
            </tr>
            <tr style={{background:"#d5f5e3"}}>
              <td style={{...tdBL,background:"#d5f5e3"}}>MARGEN BRUTO</td>
              <td style={{...tdB,background:"#d5f5e3"}}>{fmtM(total-annualCosto)}</td>
              {margenRow.map((v,i)=><td key={i} style={{...tdB,background:"#d5f5e3"}}>{fmtM(v)}</td>)}
              <td style={{...tdB,background:"#abebc6"}}>{fmtM(margenTotal)}</td>
            </tr>
            <tr>
              <td style={tdL}>Margen %</td>
              <td style={tdS}>{fmtP(100-costPct)}</td>
              {margenRow.map((v,i)=>{
                const rev=lineRev.fs[i]+lineRev.co[i]+lineRev.fd[i];
                return <td key={i} style={tdS}>{rev>0?fmtP(v/rev*100):"-"}</td>;
              })}
              <td style={{...tdS,background:"#d5f5e3"}}>{fmtP(y1Total>0?margenTotal/y1Total*100:0)}</td>
            </tr>
          </tbody>
        </table>
      </div>
    );
  };

  const UnitsTab = () => {
    const unitCalc = (lineVals, pv, pct) => lineVals.map(v => v > 0 ? Math.round(v * pct / pv) : 0);
    const lineUnits = (lv) => ({
      b: unitCalc(lv, pvp.b, comboRevSplit.b),
      w: unitCalc(lv, pvp.w, comboRevSplit.w),
      t: unitCalc(lv, pvp.t, comboRevSplit.t),
    });
    const fsU = lineUnits(lineRev.fs);
    const coU = lineUnits(lineRev.co);
    const fdU = lineUnits(lineRev.fd);
    const totalU = MO_PCT.map((_,i)=>fsU.b[i]+fsU.w[i]+fsU.t[i]+coU.b[i]+coU.w[i]+coU.t[i]+fdU.b[i]+fdU.w[i]+fdU.t[i]);

    const URow = ({label,vals,bold,indent,isCel})=>{
      const s=bold?tdB:isCel?tdCel:tdS;
      const sL=bold?tdBL:{...tdL,paddingLeft:indent?`${indent*16}px`:"6px"};
      const y1=vals.reduce((a,b)=>a+b,0);
      return(<tr>
        <td style={sL}>{label}</td>
        {vals.map((v,i)=><td key={i} style={s}>{v===0?"-":fmtU(v)}</td>)}
        <td style={{...s,background:"#d5f5e3"}}>{fmtU(y1)}</td>
      </tr>);
    };

    const LineBlock = ({label,annual,units,pvpVal})=>{
      const tot = units.b.map((v,i)=>v+units.w[i]+units.t[i]);
      return(<>
        <URow label={label} vals={tot} bold/>
        <URow label={`  BONELESS (SODA & FRIES)`} vals={units.b} indent={2}/>
        <URow label={`  WINGS (SODA & FRIES)`} vals={units.w} indent={2}/>
        <URow label={`  3 PIECES TENDER (SODA & FRIES)`} vals={units.t} indent={2}/>
      </>);
    };

    return (
      <div style={{overflowX:"auto"}}>
        <div style={{background:"#fff3cd",padding:8,borderRadius:4,marginBottom:8,fontSize:"11px"}}>
          <strong>Campos editables:</strong>
          <div style={{display:"flex",gap:16,flexWrap:"wrap",marginTop:6,alignItems:"center"}}>
            <span>PVP Boneless: <OCell value={pvp.b} onChange={v=>setPvp(p=>({...p,b:v}))} step={0.01} style={{width:65}}/></span>
            <span>PVP Wings: <OCell value={pvp.w} onChange={v=>setPvp(p=>({...p,w:v}))} step={0.01} style={{width:65}}/></span>
            <span>PVP Tender: <OCell value={pvp.t} onChange={v=>setPvp(p=>({...p,t:v}))} step={0.01} style={{width:65}}/></span>
          </div>
          <div style={{display:"flex",gap:16,flexWrap:"wrap",marginTop:6,alignItems:"center"}}>
            <span>% Boneless: <OCell value={mix.b} onChange={v=>setMix(p=>({...p,b:v}))} step={1} style={{width:45}}/></span>
            <span>% Wings: <OCell value={mix.w} onChange={v=>setMix(p=>({...p,w:v}))} step={1} style={{width:45}}/></span>
            <span>% Tender: <OCell value={mix.t} onChange={v=>setMix(p=>({...p,t:v}))} step={1} style={{width:45}}/></span>
            <span style={{fontSize:"10px",color:Math.abs(mix.b+mix.w+mix.t-100)<0.01?"green":"red"}}>
              (Total: {mix.b+mix.w+mix.t}%)
            </span>
          </div>
        </div>
        <table style={{borderCollapse:"collapse",width:"100%",minWidth:"1100px"}}>
          <thead>
            <tr>
              <th style={{...thS,textAlign:"left",minWidth:"240px"}}>Número de combos requeridos</th>
              {MO_LBL.map((m,i)=><th key={i} style={thS}>{m}<br/><span style={{color:"#aed6f1"}}>{(MO_PCT[i]*100)}%</span></th>)}
              <th style={{...thS,background:"#196f3d"}}>TOTAL Y1</th>
            </tr>
          </thead>
          <tbody>
            <tr style={{background:"#eaf2f8"}}>
              <td style={tdBL}>TOTAL COMBOS</td>
              {totalU.map((v,i)=><td key={i} style={tdB}>{v===0?"-":fmtU(v)}</td>)}
              <td style={{...tdB,background:"#d5f5e3"}}>{fmtU(totalU.reduce((a,b)=>a+b,0))}</td>
            </tr>
            <LineBlock label={`Ventas FlagShip — $${fmt(fs,0)}`} annual={fs} units={fsU}/>
            <LineBlock label={`Ventas Core — $${fmt(co,0)} (mes ${launchCore})`} annual={co} units={coU}/>
            <LineBlock label={`Ventas FrontDesk — $${fmt(fd,0)} (mes ${launchFD})`} annual={fd} units={fdU}/>
          </tbody>
        </table>
      </div>
    );
  };

  const CosteoTab = () => {
    const ComboTable = ({title,comboKey,pvpVal}) => {
      const items = ing[comboKey];
      const totalRaw = items.reduce((s,it)=>s+it.w*it.cu,0);
      const totalBuf = totalRaw*1.05;
      const cogsP = pvpVal>0?(totalBuf/pvpVal*100):0;
      return(
        <div style={{marginBottom:24}}>
          <div style={{background:"#1a5276",color:"#fff",padding:"6px 12px",fontWeight:"bold",fontSize:"12px",borderRadius:"4px 4px 0 0"}}>
            {title} — PVP: ${pvpVal.toFixed(2)}
          </div>
          <table style={{borderCollapse:"collapse",width:"100%"}}>
            <thead>
              <tr>
                <th style={{...thS,textAlign:"left",minWidth:180}}>Ingrediente</th>
                <th style={thS}>UOM</th>
                <th style={{...thS,background:"#b7950b"}}>Peso/Cant.</th>
                <th style={{...thS,background:"#b7950b"}}>Costo Unit.</th>
                <th style={thS}>Costo Final</th>
                <th style={thS}>% Costo</th>
              </tr>
            </thead>
            <tbody>
              {items.map((it,i)=>{
                const fc = it.w*it.cu;
                return(
                  <tr key={i}>
                    <td style={tdL}>{it.name}</td>
                    <td style={{...tdS,textAlign:"center"}}>{it.uom}</td>
                    <td style={tdS}><OCell value={it.w} onChange={v=>updateIng(comboKey,i,"w",v)} step={0.01}/></td>
                    <td style={tdS}><OCell value={it.cu} onChange={v=>updateIng(comboKey,i,"cu",v)} step={0.0001}/></td>
                    <td style={{...tdS,background:"#fdebd0"}}>${fc.toFixed(4)}</td>
                    <td style={tdS}>{totalRaw>0?(fc/totalRaw*100).toFixed(0):0}%</td>
                  </tr>
                );
              })}
              <tr style={{background:"#eaf2f8"}}>
                <td style={tdBL} colSpan={4}>Total</td>
                <td style={tdB}>${totalRaw.toFixed(2)}</td>
                <td style={tdB}>100%</td>
              </tr>
              <tr style={{background:"#d5f5e3"}}>
                <td style={{...tdBL,background:"#d5f5e3"}} colSpan={4}>Costo Final +5% contingencia</td>
                <td style={{...tdB,background:"#d5f5e3"}}>${totalBuf.toFixed(2)}</td>
                <td style={{...tdB,background:"#d5f5e3"}}></td>
              </tr>
              <tr style={{background:"#fadbd8"}}>
                <td style={{...tdBL,background:"#fadbd8"}} colSpan={4}>PVP (sin IVA)</td>
                <td style={{...tdB,background:"#fadbd8"}}>${pvpVal.toFixed(2)}</td>
                <td style={{...tdB,background:"#fadbd8"}}></td>
              </tr>
              <tr style={{background:"#f9e79f"}}>
                <td style={{...tdBL,background:"#f9e79f"}} colSpan={4}>COGS / Sales %</td>
                <td style={{...tdB,background:"#f9e79f"}}>{cogsP.toFixed(1)}%</td>
                <td style={{...tdB,background:"#f9e79f"}}></td>
              </tr>
            </tbody>
          </table>
        </div>
      );
    };
    return(
      <div>
        <div style={{background:"#fff3cd",padding:8,borderRadius:4,marginBottom:12,fontSize:"11px"}}>
          <strong>Edita el Peso/Cantidad y Costo Unitario</strong> (celdas naranja) para recalcular el costo por combo.
        </div>
        <ComboTable title="COMBO 1 — BONELESS (SODA & FRIES)" comboKey="boneless" pvpVal={pvp.b}/>
        <ComboTable title="COMBO 2 — WINGS (SODA & FRIES)" comboKey="wings" pvpVal={pvp.w}/>
        <ComboTable title="COMBO 3 — 3 PIECES TENDER (SODA & FRIES)" comboKey="tender" pvpVal={pvp.t}/>
      </div>
    );
  };

  const SummaryBar = () => {
    const margenPct = 100-costPct;
    const cogsB = comboCost.b.buffered/pvp.b*100;
    const cogsW = comboCost.w.buffered/pvp.w*100;
    const cogsT = comboCost.t.buffered/pvp.t*100;
    return(
      <div style={{display:"flex",gap:12,flexWrap:"wrap",marginBottom:12}}>
        {[
          {l:"Ingresos Meta",v:`$${fmt(total,0)}`,c:"#2980b9"},
          {l:"Ingresos Y1",v:`$${fmt(y1Total,0)}`,c:"#27ae60"},
          {l:"Margen Bruto",v:`${fmtP(margenPct)}`,c:margenPct>=60?"#27ae60":"#e74c3c"},
          {l:"COGS Boneless",v:`${cogsB.toFixed(1)}%`,c:cogsB<=35?"#27ae60":"#e67e22"},
          {l:"COGS Wings",v:`${cogsW.toFixed(1)}%`,c:cogsW<=35?"#27ae60":"#e67e22"},
          {l:"COGS Tender",v:`${cogsT.toFixed(1)}%`,c:cogsT<=35?"#27ae60":"#e67e22"},
        ].map((d,i)=>(
          <div key={i} style={{background:"#fff",border:`2px solid ${d.c}`,borderRadius:8,padding:"8px 14px",minWidth:110,textAlign:"center"}}>
            <div style={{fontSize:"10px",color:"#666",marginBottom:2}}>{d.l}</div>
            <div style={{fontSize:"16px",fontWeight:"bold",color:d.c}}>{d.v}</div>
          </div>
        ))}
      </div>
    );
  };

  return (
    <div style={{fontFamily:"'Segoe UI',Arial,sans-serif",padding:12,maxWidth:1400,background:"#f8f9fa",minHeight:"100vh"}}>
      <div style={{textAlign:"center",marginBottom:12}}>
        <h2 style={{margin:0,color:"#1a5276",fontSize:"18px"}}>Business Case — Modelo Financiero Interactivo</h2>
        <p style={{margin:"4px 0 0",fontSize:"11px",color:"#777"}}>Edita las celdas en <span style={{background:"#FFD966",padding:"1px 6px",borderRadius:3,fontWeight:"bold"}}>naranja</span> para recalcular</p>
      </div>
      <SummaryBar/>
      <div style={{display:"flex",marginBottom:0}}>
        {["P&L Y1-Y2 Edit","Unidades Vendidas Edit","Costeo Edit"].map((t,i)=>(
          <button key={i} onClick={()=>setTab(i)} style={tabStyle(i)}>{t}</button>
        ))}
      </div>
      <div style={{background:"#fff",border:"1px solid #d5d8dc",borderRadius:"0 6px 6px 6px",padding:12,overflowX:"auto"}}>
        {tab===0 && <PLTab/>}
        {tab===1 && <UnitsTab/>}
        {tab===2 && <CosteoTab/>}
      </div>
      <div style={{marginTop:8,fontSize:"10px",color:"#999",textAlign:"center"}}>
        Leyenda: <span style={{background:"#FFD966",padding:"1px 4px"}}>Editable</span> · <span style={{background:"#d4effc",padding:"1px 4px"}}>Calculado (fuente)</span> · <span style={{background:"#d5f5e3",padding:"1px 4px"}}>Total Y1</span>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<BusinessCase/>);
</script>
</body>
</html>
